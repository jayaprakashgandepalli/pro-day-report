<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>శ్రీ వాత్సల్య జూనియర్ కళాశాల - బ్రోచర్</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      line-height: 1.5;
      padding-bottom: 24px;
    }

    /* Top Eye-Catchy Sticky Header with College Name Only */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 16px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .brand-title {
      font-size: 22px;
      font-weight: 900;
      margin: 0;
      background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 50%, #EF4444 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.3px;
      text-shadow: 0 2px 12px rgba(245, 158, 11, 0.3);
      line-height: 1.3;
    }
    .brand-subtitle {
      font-size: 11px;
      color: #94A3B8;
      font-weight: 600;
      letter-spacing: 1px;
      margin-top: 3px;
      text-transform: uppercase;
    }

    /* Main Container */
    main {
      max-width: 580px;
      margin: 0 auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Card */
    .page-card {
      background: #1E293B;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* Image Wrapper */
    .img-wrap {
      position: relative;
      background: #020617;
      cursor: zoom-in;
      display: block;
      width: 100%;
    }
    .img-wrap img {
      width: 100%;
      height: auto;
      display: block;
      border: none;
    }
    .zoom-hint {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      color: #F8FAFC;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.96);
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    .modal.active {
      display: flex;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #FFFFFF;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1001;
    }
    .modal-img {
      max-width: 100%;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Top Sticky Header with Eye-Catchy College Name Only -->
  <header>
    <h1 class="brand-title">🏛️ శ్రీ వాత్సల్య జూనియర్ కళాశాల</h1>
    <div class="brand-subtitle">Sri Vaatsalya Educational Institutions • Visakhapatnam</div>
  </header>

  <!-- Main Pages List -->
  <main id="pages-container">
    <!-- Generated via JS -->
  </main>

  <!-- Fullscreen Modal / Pinch to Zoom -->
  <div class="modal" id="modal" onclick="closeModal()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <img class="modal-img" id="modal-img" src="" alt="Full view" onclick="event.stopPropagation()">
  </div>

  <script>
    const PAGES = [
      { id: 0, url: "https://files.catbox.moe/na3eeh.jpeg" },
      { id: 1, url: "https://files.catbox.moe/sslv84.jpg" },
      { id: 2, url: "https://files.catbox.moe/gosddd.jpg" },
      { id: 3, url: "https://files.catbox.moe/xfi1wm.jpg" },
      { id: 4, url: "https://files.catbox.moe/kd67bz.jpg" },
      { id: 5, url: "https://files.catbox.moe/oufw8n.jpeg" },
      { id: 6, url: "https://files.catbox.moe/akwhbu.jpeg" },
      { id: 7, url: "https://files.catbox.moe/37l58s.jpeg" },
      { id: 8, url: "https://files.catbox.moe/8gdmz9.jpeg" },
      { id: 9, url: "https://files.catbox.moe/g432hd.jpeg" },
      { id: 10, url: "https://files.catbox.moe/jglcy2.jpeg" },
      { id: 11, url: "https://files.catbox.moe/bdqn95.jpeg" },
      { id: 12, url: "https://files.catbox.moe/ejrj9r.jpeg" },
      { id: 13, url: "https://files.catbox.moe/zqq17r.jpeg" },
      { id: 14, url: "https://files.catbox.moe/380qn2.jpeg" },
      { id: 15, url: "https://files.catbox.moe/sib2sj.jpeg" },
      { id: 16, url: "https://files.catbox.moe/wbfuj2.jpeg" },
      { id: 17, url: "https://files.catbox.moe/c3o5yv.jpeg" },
      { id: 18, url: "https://files.catbox.moe/hzjlgn.jpeg" }
    ];

    const container = document.getElementById('pages-container');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');

    PAGES.forEach((page, index) => {
      const card = document.createElement('div');
      card.className = 'page-card';
      card.innerHTML = `
        <div class="img-wrap" onclick="openModal('${page.url}')">
          <img src="${page.url}" alt="Page ${page.id}" loading="${index < 2 ? 'eager' : 'lazy'}">
          <div class="zoom-hint">🔍 Tap to Zoom</div>
        </div>
      `;
      container.appendChild(card);
    });

    function openModal(url) {
      modalImg.src = url;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
